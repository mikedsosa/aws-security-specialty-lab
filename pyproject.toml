[project]
name = "scs-lab"
version = "0.1.0"
description = "Offline helpers and tests for an AWS Security Specialty study lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["boto3", "moto[s3,events]>=5", "pytest", "ruff", "checkov", "parliament", "setuptools<81"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lambda/remediate_s3_bpa"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["scs_lab", "handler", "conftest"]
